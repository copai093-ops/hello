<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Power Off Screen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
    }
    .container {
      text-align: center;
    }
    .loader {
      width: 90px;
      height: 90px;
      margin: 0 auto 30px auto;
      border: 8px solid #444;
      border-top: 8px solid #ffffff;
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255,255,255,0.4);
    }
    p {
      font-size: 1.1rem;
      color: #aaa;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loader"></div>
    <h1>Power Off</h1>
    <p>Shutting down...</p>
  </div>

  <script>
    function vibrateDevice() {
      if ("vibrate" in navigator) {
        navigator.vibrate([200, 100, 300, 100, 150]);
      }
    }

    // 5 seconds baad vibration + screen black
    window.addEventListener('load', () => {
      setTimeout(() => {
        vibrateDevice();

        // Vibration ke turant baad screen black kar do
        // Vibration pattern ka total time ~ 200+100+300+100+150 = 850ms
        setTimeout(() => {
          document.body.innerHTML = '';           // sab clear
          document.body.style.background = '#000'; // ensure black
        }, 900); // 900ms safety margin

      }, 5000); // 5 seconds
    });
  </script>
</body>
</html>
